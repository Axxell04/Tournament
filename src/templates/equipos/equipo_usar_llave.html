{% extends 'base.html' %}

{% block content %}
    <div style="display: flex; flex-direction: row; gap: 10px; align-items: center; justify-content: center; padding-top: 20px;">
        <div class="container-form">
            <h2>Inscripción de jugador</h2>
            <form action="{{ request.path }}" method="post" style="display: flex; flex-direction: column; gap: 3px; width: fit-content;">
                <div>
                    <label for="cedula">Cedula</label>
                    <input class="input-cedula" type="text" name="cedula" required>
                </div>
                <div>
                    <label for="nombre">Nombre</label>
                    <input class="input-nombre" type="text" name="nombre" required maxlength="14">
                </div>
                <div>
                    <label for="contraseña">Contraseña</label>
                    <input type="password" name="contraseña" required>
                </div>
                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input type="date" name="fecha_nacimiento">
    
                </div>
                <div>
                    <label for="posicion">Posición</label>
                    <select class="input-posicion" name="posicion" value="">
                        <option value=""></option>
                        <option value="DEL">DEL</option>
                        <option value="MC">MC</option>
                        <option value="DEF">DEF</option>
                        <option value="PT">PT</option>
                    </select>
                </div>
                <br>
                <input class="btn" type="submit" value="Inscribirse">
            </form>
        </div>
    
        <div class="card scale-in-center">
            <span class="player-media">
                85
            </span>
            <span class="player-position">
                ---
            </span>
            <span class="player-name">
                -------
            </span>
    
            <section>
                <div>
                    <span class="player-stats-left-values player-rit-value">
                        99
                    </span>
                    <span class="player-stats-left-values player-tir-value">
                        99
                    </span>
                    <span class="player-stats-left-values player-pas-value">
                        99
                    </span>
                </div>
                <div>
                    <span class="player-stats-left-labels player-rit-label">
                        RIT
                    </span>
                    <span class="player-stats-left-labels player-tir-label">
                        TIR
                    </span>
                    <span class="player-stats-left-labels player-pas-label">
                        PAS
                    </span>
                </div>
            </section>
    
            <section>
                <div>
                    <span class="player-stats-right-values player-reg-value">
                        99
                    </span>
                    <span class="player-stats-right-values player-def-value">
                        99
                    </span>
                    <span class="player-stats-right-values player-fis-value">
                        99
                    </span>
                </div>
                <div>
                    <span class="player-stats-right-labels player-reg-label">
                        REG
                    </span>
                    <span class="player-stats-right-labels player-def-label">
                        DEF
                    </span>
                    <span class="player-stats-right-labels player-fis-label">
                        FIS
                    </span>
                </div>
            </section>
    
    
            <img src="{{ url_for('static', filename='img/cards/Card2.png') }}" alt="" height="500">
            <img class="player-img" src="{{ url_for('static', filename='img/cards/player3.png') }}" alt="" height="200">
        </div>

    </div>

    <script>
        let inputNombre = document.querySelector(".input-nombre");
        let inputPosicion = document.querySelector(".input-posicion");
        let playerNameCard = document.querySelector(".player-name");
        let playerPosition = document.querySelector(".player-position");

        inputNombre.addEventListener("input", (e) => {
            const target = e.target;
            if (target.value) {
                playerNameCard.textContent = target.value;
            } else {
                playerNameCard.textContent = "-------"
            }
        });

        inputPosicion.addEventListener("input", (e) => {
            const target = e.target;
            if (target.value) {
                playerPosition.textContent = target.value;
            } else {
                playerPosition.textContent = "---";
            }
        });

    </script>

    <style>
        .btn {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid black;
        }
        .btn:hover {
            background-color: crimson;
            color: aliceblue;
        }
        .container-form {
            display: flex;
            flex-direction: column;
            background-color: gainsboro;
            place-items: center;
            padding: 20px 50px;
            border: 1px solid black;
            border-radius: 15px;
            gap: 10px;
            width: fit-content;
            /* margin-inline: auto; */
            margin-top: 50px;
        }
        .container-form div {
            display: flex;
            flex-direction: column;
            gap: 5px;
            place-items: center;
        }
    </style>

{% endblock content %}
